<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Lrssn Shore: wallpaper</title>
<!-- Generated by scripts/build.py from palette/. Do not edit.
     scripts/render-art.sh renders it to omarchy/lrssn-shore/backgrounds/. -->
<style>
  html, body { margin: 0; background: #fdf6ea; }
  canvas { display: block; }
</style>
<canvas id="art" width="3840" height="2160"></canvas>
<script>
// A summer evening on a beach: the sun setting over clear tropical water,
// coral in the shallows, and a bonfire on the sand.
const P = {
  bg: '#fdf6ea',
  sand: '#ecdfc8',
  fg: '#13303d',
  primary: '#fc6600',
  soft: '#ffe3cc',
  water: '#00999a',
  deep: '#00629c',
  lagoon: '#00756a',
  coralPink: '#d94a85',
  coralRed: '#e0533a',
  urchin: '#8a3fbf',
  driftwood: '#8a6a45',
};
// Colours of the evening, which only the wallpaper uses.
const SKY_TOP = '#86aedb';
const SKY_MIDDLE = '#f2c4b0';
const SKY_HORIZON = '#ffb27a';
const SUN = '#ffd27a';
const SHALLOWS = '#6fdcd4';
const FOAM = '#ffffff';
const WET_SAND = '#e6cba0';
const FLAME = '#ffd36b';

const canvas = document.getElementById('art');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const HORIZON = 1010;
const SHORE = 1560;

// A seeded random number generator, so that every render is the same.
function seeded(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = seeded(1979);
const between = (low, high) => low + rand() * (high - low);

function alpha(hex, a) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

function glow(x, y, radius, colour, strength) {
  const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
  gradient.addColorStop(0, alpha(colour, strength));
  gradient.addColorStop(1, alpha(colour, 0));
  ctx.fillStyle = gradient;
  ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
}

function dot(x, y, radius, colour) {
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

// A wavy line across the width, as a path for a stroke or a fill.
function wave(y, height, length, phase) {
  ctx.moveTo(0, y);
  for (let x = 0; x <= W; x += 20) {
    ctx.lineTo(x, y + Math.sin(x / length + phase) * height + Math.sin(x / (length * 0.37) + phase * 2) * height * 0.4);
  }
}

// The sky.
const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
sky.addColorStop(0, SKY_TOP);
sky.addColorStop(0.62, SKY_MIDDLE);
sky.addColorStop(1, SKY_HORIZON);
ctx.fillStyle = sky;
ctx.fillRect(0, 0, W, HORIZON);

// Thin clouds, lit from below.
for (const [x, y, w] of [[600, 300, 900], [1500, 210, 700], [3100, 380, 1000], [2300, 560, 600], [400, 700, 500]]) {
  ctx.fillStyle = alpha(P.soft, 0.55);
  ctx.beginPath();
  ctx.ellipse(x, y, w / 2, 26, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = alpha(P.primary, 0.12);
  ctx.beginPath();
  ctx.ellipse(x + 40, y + 14, w / 2.4, 12, 0, 0, Math.PI * 2);
  ctx.fill();
}

// The sun, half set.
glow(2700, HORIZON, 1100, P.primary, 0.32);
glow(2700, HORIZON, 420, SUN, 0.6);
dot(2700, HORIZON, 170, SUN);

// Islands on the horizon.
ctx.fillStyle = alpha(P.lagoon, 0.55);
for (const [x, w, h] of [[700, 520, 60], [1050, 260, 34], [3500, 380, 46]]) {
  ctx.beginPath();
  ctx.ellipse(x, HORIZON, w / 2, h, 0, Math.PI, 0);
  ctx.fill();
}

// The sea: deep blue at the horizon, turquoise, then clear shallows.
const sea = ctx.createLinearGradient(0, HORIZON, 0, SHORE);
sea.addColorStop(0, P.deep);
sea.addColorStop(0.45, P.water);
sea.addColorStop(1, SHALLOWS);
ctx.fillStyle = sea;
ctx.fillRect(0, HORIZON, W, SHORE - HORIZON + 80);

// The sun on the water.
for (let i = 0; i < 160; i++) {
  const y = between(HORIZON + 8, SHORE - 160);
  const t = (y - HORIZON) / (SHORE - HORIZON);
  const spread = 120 + t * 520;
  const x = 2700 + between(-spread, spread) * between(0.2, 1);
  ctx.fillStyle = alpha(SUN, (1 - t) * 0.75);
  ctx.fillRect(x, y, between(30, 140) * (0.4 + t), 4 + t * 6);
}

// Coral in the shallows, under the clear water.
function branch(x, y, length, angle, width, colour, depth) {
  const x2 = x + Math.cos(angle) * length;
  const y2 = y + Math.sin(angle) * length;
  ctx.strokeStyle = colour;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  if (depth > 0) {
    branch(x2, y2, length * 0.72, angle - between(0.25, 0.55), width * 0.72, colour, depth - 1);
    branch(x2, y2, length * 0.72, angle + between(0.25, 0.55), width * 0.72, colour, depth - 1);
  }
}
const corals = [P.coralPink, P.coralRed, P.urchin, P.primary];
for (let i = 0; i < 26; i++) {
  const x = between(80, W - 80);
  const y = between(SHORE - 210, SHORE - 40);
  const colour = corals[i % corals.length];
  if (i % 3 === 0) {
    for (let j = 0; j < 7; j++) {
      dot(x + between(-60, 60), y + between(-25, 10), between(18, 34), alpha(colour, 0.9));
    }
  } else {
    branch(x, y, between(40, 70), -Math.PI / 2 + between(-0.3, 0.3), between(12, 18), alpha(colour, 0.9), 3);
  }
}
const shallows = ctx.createLinearGradient(0, SHORE - 300, 0, SHORE);
shallows.addColorStop(0, alpha(SHALLOWS, 0));
shallows.addColorStop(0.5, alpha(SHALLOWS, 0.4));
shallows.addColorStop(1, alpha(SHALLOWS, 0.5));
ctx.fillStyle = shallows;
ctx.fillRect(0, SHORE - 300, W, 380);

// Light dancing on the shallow sea floor.
ctx.strokeStyle = alpha(FOAM, 0.18);
ctx.lineWidth = 4;
for (let i = 0; i < 6; i++) {
  ctx.beginPath();
  wave(SHORE - 230 + i * 36, 8, 90 + i * 13, i * 1.7);
  ctx.stroke();
}

// The sand, with the wet edge, foam and a dry beach.
ctx.fillStyle = WET_SAND;
ctx.beginPath();
wave(SHORE, 22, 260, 0.4);
ctx.lineTo(W, H);
ctx.lineTo(0, H);
ctx.fill();

const beach = ctx.createLinearGradient(0, SHORE + 80, 0, H);
beach.addColorStop(0, P.sand);
beach.addColorStop(1, P.bg);
ctx.fillStyle = beach;
ctx.beginPath();
wave(SHORE + 90, 30, 340, 1.3);
ctx.lineTo(W, H);
ctx.lineTo(0, H);
ctx.fill();

ctx.strokeStyle = alpha(FOAM, 0.9);
ctx.lineWidth = 10;
ctx.beginPath();
wave(SHORE - 4, 22, 260, 0.4);
ctx.stroke();
ctx.strokeStyle = alpha(FOAM, 0.45);
ctx.lineWidth = 6;
ctx.beginPath();
wave(SHORE - 46, 16, 210, 2.1);
ctx.stroke();

for (let i = 0; i < 900; i++) {
  dot(between(0, W), between(SHORE + 120, H), between(1, 3), alpha(P.driftwood, between(0.08, 0.25)));
}

// The bonfire: its glow on the sand, stones, logs, flames and sparks.
const fire = { x: 860, y: 1840 };
glow(fire.x, fire.y - 60, 900, P.primary, 0.3);
for (let i = 0; i < 11; i++) {
  const angle = (i / 11) * Math.PI * 2;
  ctx.fillStyle = i % 2 ? '#a3917a' : '#8d7c66';
  ctx.beginPath();
  ctx.ellipse(fire.x + Math.cos(angle) * 210, fire.y + 40 + Math.sin(angle) * 60, 54, 32, 0, 0, Math.PI * 2);
  ctx.fill();
}
ctx.save();
ctx.translate(fire.x, fire.y + 10);
for (const [angle, colour] of [[-0.35, P.driftwood], [0.35, '#6b4a2e'], [0, '#7d5636']]) {
  ctx.save();
  ctx.rotate(angle);
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.roundRect(-200, -26, 400, 52, 26);
  ctx.fill();
  ctx.restore();
}
ctx.restore();

function flame(x, y, width, height, colour) {
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.moveTo(x, y - height);
  ctx.bezierCurveTo(x + width * 0.25, y - height * 0.6, x + width * 0.6, y - height * 0.35, x + width * 0.5, y);
  ctx.lineTo(x - width * 0.5, y);
  ctx.bezierCurveTo(x - width * 0.6, y - height * 0.35, x - width * 0.25, y - height * 0.6, x, y - height);
  ctx.fill();
}
flame(fire.x - 90, fire.y, 200, 300, alpha(P.primary, 0.95));
flame(fire.x + 80, fire.y, 220, 360, alpha(P.primary, 0.95));
flame(fire.x, fire.y, 300, 470, P.primary);
flame(fire.x - 20, fire.y, 210, 340, '#ff9a2e');
flame(fire.x + 10, fire.y, 120, 210, FLAME);
for (let i = 0; i < 90; i++) {
  const y = between(fire.y - 1200, fire.y - 300);
  const t = (fire.y - y) / 1200;
  dot(fire.x + between(-260, 260) * t + 120 * t, y, between(2, 6), alpha(rand() < 0.5 ? P.primary : FLAME, 1 - t * 0.8));
}
</script>
</html>
