# {{ name }} for Alacritty.
# Generated by scripts/build.py from palette/. Do not edit.

[colors.primary]
background = "{{ bg }}"
foreground = "{{ fg }}"
dim_foreground = "{{ fg-muted }}"
bright_foreground = "{{ fg-bright }}"

[colors.cursor]
text = "{{ bg }}"
cursor = "{{ accent }}"

[colors.vi_mode_cursor]
text = "{{ bg }}"
cursor = "{{ secondary }}"

[colors.selection]
text = "CellForeground"
background = "{{ selection }}"

[colors.search.matches]
foreground = "{{ fg }}"
background = "{{ selection }}"

[colors.search.focused_match]
foreground = "{{ on-primary }}"
background = "{{ primary }}"

[colors.hints.start]
foreground = "{{ on-primary }}"
background = "{{ primary }}"

[colors.hints.end]
foreground = "{{ fg }}"
background = "{{ bg-raised }}"

[colors.footer_bar]
foreground = "{{ fg }}"
background = "{{ bg-raised }}"

[colors.normal]
black = "{{ ansi.black }}"
red = "{{ ansi.red }}"
green = "{{ ansi.green }}"
yellow = "{{ ansi.yellow }}"
blue = "{{ ansi.blue }}"
magenta = "{{ ansi.magenta }}"
cyan = "{{ ansi.cyan }}"
white = "{{ ansi.white }}"

[colors.bright]
black = "{{ ansi.bright-black }}"
red = "{{ ansi.bright-red }}"
green = "{{ ansi.bright-green }}"
yellow = "{{ ansi.bright-yellow }}"
blue = "{{ ansi.bright-blue }}"
magenta = "{{ ansi.bright-magenta }}"
cyan = "{{ ansi.bright-cyan }}"
white = "{{ ansi.bright-white }}"
