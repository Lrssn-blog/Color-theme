<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>{{ hearth.name }}: wallpaper</title>
<!-- Generated by scripts/build.py from palette/. Do not edit.
     scripts/render-art.sh renders it to omarchy/lrssn-hearth/backgrounds/. -->
<style>
  html, body { margin: 0; background: {{ hearth.bg-deep }}; }
  canvas { display: block; }
</style>
<canvas id="art" width="3840" height="2160"></canvas>
<script>
// A cottage on New Year's Eve: a window onto a snowy night with fireworks,
// lit from inside by a log fire in the bottom left corner.
const P = {
  bg: '{{ hearth.bg }}',
  bgDim: '{{ hearth.bg-dim }}',
  bgDeep: '{{ hearth.bg-deep }}',
  bgLine: '{{ hearth.bg-line }}',
  fg: '{{ hearth.fg }}',
  fgBright: '{{ hearth.fg-bright }}',
  primary: '{{ hearth.primary }}',
  gold: '{{ hearth.function }}',
  pink: '{{ hearth.number }}',
  violet: '{{ hearth.builtin }}',
  green: '{{ hearth.string }}',
  ice: '{{ hearth.type }}',
  ember: '{{ hearth.tag }}',
  wood: '{{ hearth.selection }}',
  night: '{{ hearth.ansi.blue }}',
};
// Colours of the night outside, which only the wallpaper uses.
const SKY_TOP = '#070d18';
const SKY_HORIZON = '#1a2a40';
const SNOW = '#dbe5ef';
const SNOW_SHADE = '#8ea2b8';
const PINE = '#0a141d';

const canvas = document.getElementById('art');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// A seeded random number generator, so that every render is the same.
function seeded(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = seeded(2027);
const between = (low, high) => low + rand() * (high - low);

function alpha(hex, a) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}

function glow(x, y, radius, colour, strength) {
  const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
  gradient.addColorStop(0, alpha(colour, strength));
  gradient.addColorStop(1, alpha(colour, 0));
  ctx.fillStyle = gradient;
  ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
}

function dot(x, y, radius, colour) {
  ctx.fillStyle = colour;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
}

// The wall: dark green boards.
ctx.fillStyle = P.bg;
ctx.fillRect(0, 0, W, H);
for (let x = 0, i = 0; x < W; x += 240, i++) {
  ctx.fillStyle = i % 2 ? alpha(P.bgLine, 0.9) : alpha(P.bgDim, 0.6);
  ctx.fillRect(x, 0, 240, H);
  ctx.fillStyle = P.bgDeep;
  ctx.fillRect(x, 0, 5, H);
}

// The window.
const win = { x: 1560, y: 250, w: 1900, h: 1380 };
const frame = 72;
const glass = { x: win.x + frame, y: win.y + frame, w: win.w - frame * 2, h: win.h - frame * 2 };
const horizon = glass.y + glass.h * 0.7;

ctx.save();
ctx.beginPath();
ctx.rect(glass.x, glass.y, glass.w, glass.h);
ctx.clip();

const sky = ctx.createLinearGradient(0, glass.y, 0, horizon);
sky.addColorStop(0, SKY_TOP);
sky.addColorStop(1, SKY_HORIZON);
ctx.fillStyle = sky;
ctx.fillRect(glass.x, glass.y, glass.w, glass.h);

for (let i = 0; i < 260; i++) {
  dot(between(glass.x, glass.x + glass.w), between(glass.y, horizon), between(1.2, 3), alpha(P.fgBright, between(0.25, 0.85)));
}

// The fireworks.
function burst(x, y, radius, colour, rays) {
  glow(x, y, radius * 1.5, colour, 0.22);
  for (let i = 0; i < rays; i++) {
    const angle = (i / rays) * Math.PI * 2 + between(-0.06, 0.06);
    const reach = radius * between(0.8, 1.05);
    for (let step = 1; step <= 9; step++) {
      const t = step / 9;
      const px = x + Math.cos(angle) * reach * t;
      const py = y + Math.sin(angle) * reach * t + 60 * t * t;
      dot(px, py, 7 * (1 - t) + 2, alpha(colour, 0.95 - t * 0.6));
    }
  }
  glow(x, y, radius * 0.25, P.fgBright, 0.7);
}
burst(2860, 520, 330, P.gold, 34);
burst(2080, 560, 270, P.pink, 30);
burst(2470, 860, 190, P.violet, 24);
burst(3170, 880, 170, P.green, 22);
burst(1880, 980, 130, P.ice, 18);

// A rocket on its way up.
for (let i = 0; i < 24; i++) {
  const t = i / 24;
  dot(2660 - t * 18, 1230 - t * 420, 3 + t * 4, alpha(P.gold, 0.15 + t * 0.7));
}

// The snow: a far hill with pines, and a near hill.
ctx.fillStyle = SNOW_SHADE;
ctx.beginPath();
ctx.moveTo(glass.x, horizon);
ctx.bezierCurveTo(glass.x + 500, horizon - 90, glass.x + 1000, horizon + 40, glass.x + glass.w, horizon - 70);
ctx.lineTo(glass.x + glass.w, glass.y + glass.h);
ctx.lineTo(glass.x, glass.y + glass.h);
ctx.fill();

function pine(x, base, height) {
  const width = height * 0.42;
  for (let tier = 0; tier < 4; tier++) {
    const top = base - height + tier * height * 0.2;
    const bottom = top + height * 0.42;
    const half = width * (0.45 + tier * 0.18);
    ctx.fillStyle = PINE;
    ctx.beginPath();
    ctx.moveTo(x, top);
    ctx.lineTo(x + half, bottom);
    ctx.lineTo(x - half, bottom);
    ctx.fill();
    ctx.strokeStyle = alpha(SNOW, 0.85);
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(x - half * 0.7, bottom - 6);
    ctx.lineTo(x + half * 0.5, bottom - 10);
    ctx.stroke();
  }
  ctx.fillStyle = PINE;
  ctx.fillRect(x - 8, base - 10, 16, 30);
}
for (let x = glass.x - 40; x < glass.x + glass.w + 60; x += between(70, 150)) {
  pine(x, horizon - 20 + between(-20, 50), between(120, 260));
}

const near = ctx.createLinearGradient(0, horizon + 60, 0, glass.y + glass.h);
near.addColorStop(0, SNOW);
near.addColorStop(1, '#b8c8d9');
ctx.fillStyle = near;
ctx.beginPath();
ctx.moveTo(glass.x, horizon + 140);
ctx.bezierCurveTo(glass.x + 600, horizon + 40, glass.x + 1200, horizon + 200, glass.x + glass.w, horizon + 110);
ctx.lineTo(glass.x + glass.w, glass.y + glass.h);
ctx.lineTo(glass.x, glass.y + glass.h);
ctx.fill();
// The fireworks tint the snow.
glow(2860, horizon + 200, 700, P.gold, 0.12);
glow(2080, horizon + 220, 600, P.pink, 0.1);

for (let i = 0; i < 340; i++) {
  dot(between(glass.x, glass.x + glass.w), between(glass.y, glass.y + glass.h), between(1.5, 6), alpha('#ffffff', between(0.35, 0.9)));
}

// Frost in the corners of each pane.
const panesX = [glass.x, glass.x + glass.w / 2];
const panesY = [glass.y, glass.y + glass.h * 0.45];
const paneW = glass.w / 2;
const paneH = [glass.h * 0.45, glass.h * 0.55];
for (const px of panesX) {
  panesY.forEach((py, row) => {
    for (const [cx, cy] of [[px, py], [px + paneW, py], [px, py + paneH[row]], [px + paneW, py + paneH[row]]]) {
      glow(cx, cy, 190, '#e6f0fa', 0.22);
    }
  });
}
ctx.restore();

// The frame and the muntins, lit by the fire from the left.
ctx.fillStyle = P.wood;
ctx.fillRect(win.x, win.y, win.w, frame);
ctx.fillRect(win.x, win.y + win.h - frame, win.w, frame);
ctx.fillRect(win.x, win.y, frame, win.h);
ctx.fillRect(win.x + win.w - frame, win.y, frame, win.h);
ctx.fillRect(glass.x + glass.w / 2 - 20, glass.y, 40, glass.h);
ctx.fillRect(glass.x, glass.y + glass.h * 0.45 - 20, glass.w, 40);
ctx.strokeStyle = alpha(P.bgDeep, 0.8);
ctx.lineWidth = 6;
ctx.strokeRect(glass.x, glass.y, glass.w, glass.h);
ctx.strokeStyle = alpha(P.primary, 0.45);
ctx.lineWidth = 8;
ctx.beginPath();
ctx.moveTo(win.x + 4, win.y + win.h);
ctx.lineTo(win.x + 4, win.y);
ctx.stroke();

// The sill, with two candles.
const sill = { x: win.x - 70, y: win.y + win.h - 10, w: win.w + 140, h: 70 };
ctx.fillStyle = '#8a5634';
ctx.fillRect(sill.x, sill.y, sill.w, sill.h);
ctx.fillStyle = alpha(P.primary, 0.35);
ctx.fillRect(sill.x, sill.y, sill.w, 8);
ctx.fillStyle = alpha(P.bgDeep, 0.6);
ctx.fillRect(sill.x, sill.y + sill.h, sill.w, 24);

function candle(x, height, width) {
  const top = sill.y - height;
  glow(x, top - 50, 420, P.gold, 0.28);
  ctx.fillStyle = P.fg;
  ctx.fillRect(x - width / 2, top, width, height);
  ctx.fillStyle = alpha(P.bgDeep, 0.25);
  ctx.fillRect(x + width / 6, top, width / 3, height);
  ctx.fillStyle = P.bgDeep;
  ctx.fillRect(x - 2, top - 16, 4, 16);
  ctx.fillStyle = P.gold;
  ctx.beginPath();
  ctx.moveTo(x, top - 90);
  ctx.quadraticCurveTo(x + 22, top - 30, x, top - 14);
  ctx.quadraticCurveTo(x - 22, top - 30, x, top - 90);
  ctx.fill();
  dot(x, top - 34, 8, P.fgBright);
}
candle(win.x + 260, 230, 64);
candle(win.x + 380, 160, 54);

// The fire: its light on the wall, and embers rising from it.
glow(260, H + 240, 2700, P.primary, 0.3);
glow(260, H + 120, 1200, P.gold, 0.18);
for (let i = 0; i < 120; i++) {
  const y = between(700, H);
  const spread = (H - y) * 0.45 + 160;
  const colour = rand() < 0.5 ? P.primary : P.gold;
  dot(between(260 - spread, 260 + spread), y, between(2, 6), alpha(colour, between(0.3, 0.9) * (y / H)));
}

// Darker corners.
const vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.7);
vignette.addColorStop(0, alpha(P.bgDeep, 0));
vignette.addColorStop(1, alpha(P.bgDeep, 0.65));
ctx.fillStyle = vignette;
ctx.fillRect(0, 0, W, H);
</script>
</html>
